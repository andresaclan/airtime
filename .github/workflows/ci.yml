name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run lint
      - run: bun run build

  frames:
    name: frames (${{ matrix.os }}, ${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, browser: chromium }
          - { os: macos-15, browser: chrome }
          # AVFoundation/H.264 on macOS; Linux WebKit is not Safari's media stack.
          - { os: macos-15, browser: webkit }
          - { os: macos-15, browser: webkit-iphone }
          - { os: macos-15, browser: safari }
          - { os: macos-15, browser: safari-ios }
    runs-on: ${{ matrix.os }}
    # The Simulator reports but doesn't block merges: it can flake, and it isn't an
    # iPhone's hardware decoder. Remove this line to make it required again.
    continue-on-error: ${{ matrix.browser == 'safari-ios' }}
    # iOS includes first boot and fresh documents in one native Safari session.
    timeout-minutes: ${{ matrix.browser == 'safari-ios' && 40 || 20 }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install browser
        if: matrix.browser != 'safari' && matrix.browser != 'safari-ios'
        shell: bash
        run: |
          browser='${{ matrix.browser }}'
          if [[ "$browser" == webkit-* ]]; then browser=webkit; fi
          bunx playwright install --with-deps "$browser" ffmpeg
      - name: Check decoded frame stepping
        if: matrix.browser != 'safari' && matrix.browser != 'safari-ios'
        env:
          # Stable Chrome's headless macOS compositor can throttle video frame
          # callbacks. Use the repository's real, focus-safe Chrome launcher.
          FRAME_BACKGROUND_CHROME: ${{ matrix.os == 'macos-15' && matrix.browser == 'chrome' && '1' || '0' }}
        run: bun run test:frames --project=${{ matrix.browser }}
      - name: Create isolated iOS Simulator
        if: matrix.browser == 'safari-ios'
        id: ios
        run: python3 scripts/frame-ios-simulator.py
      - name: Check shipping Safari
        if: matrix.browser == 'safari' || matrix.browser == 'safari-ios'
        env:
          FRAME_SAFARI_PLATFORM: ${{ matrix.browser == 'safari-ios' && 'ios' || 'mac' }}
          FRAME_IOS_SIMULATOR_UDID: ${{ steps.ios.outputs.udid }}
        shell: bash
        run: |
          sudo safaridriver --enable
          bun run preview -- --port 4173 --strictPort > /tmp/airtime-safari-server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in {1..100}; do
            if curl --fail --silent http://localhost:4173/ > /dev/null; then break; fi
            if ! kill -0 "$server" 2>/dev/null; then cat /tmp/airtime-safari-server.log; exit 1; fi
            sleep 0.3
          done
          bun run test:frames:safari
      - name: Collect Safari startup diagnostics
        if: always() && (matrix.browser == 'safari' || matrix.browser == 'safari-ios')
        shell: bash
        run: |
          mkdir -p test-results/safari-driver
          if [[ -d "$HOME/Library/Logs/com.apple.WebDriver" ]]; then
            cp -R "$HOME/Library/Logs/com.apple.WebDriver/." test-results/safari-driver/
          fi
          if [[ -f /tmp/airtime-safari-server.log ]]; then
            cp /tmp/airtime-safari-server.log test-results/safari-driver/
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frames-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Branch protection already requires `verify`. Keep that stable name, and fail
  # closed when any dependency failed, was cancelled, or was skipped.
  verify:
    if: always()
    needs: [static, frames]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          FRAMES_RESULT: ${{ needs.frames.result }}
        run: test "$STATIC_RESULT" = success && test "$FRAMES_RESULT" = success
